# STAND-IN: pyproject.toml is a shared file owned by Person 1 (scaffold, CP0).
# This minimal version exists so Person 3's code can be installed and tested
# before the scaffold lands. Merge its contents into the scaffold's version.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thoughtzero"
version = "0.0.1"
description = "Training-free AlphaZero-style search over reasoning steps"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "openai>=1.40",
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "tenacity",
    "diskcache",
    "math-verify[antlr4_13_2]",
    "numpy",
]

[project.optional-dependencies]
hf = ["transformers", "datasets"]
dev = ["pytest", "pytest-asyncio", "respx", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/thoughtzero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["network: needs network access (skipped in CI)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
