[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thoughtzero"
version = "0.0.1"
description = "Training-free AlphaZero-style search over reasoning steps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "diskcache>=5.6",
    "transformers>=4.45",
    "datasets>=2.20",
    "math-verify>=0.5",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff==0.16.10",  # keep in sync with .pre-commit-config.yaml
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
]
prm = ["torch>=2.3", "accelerate>=0.30"]
ft = ["peft>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/thoughtzero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["network: needs network access and/or API keys (skipped by default)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# never touch docs: ruff formats code blocks inside Markdown otherwise
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
